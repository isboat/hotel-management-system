name: Backend build
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-*.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test backend/Hms.Tests -c Release
      - run: dotnet publish backend/Hms.Api -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/
          if-no-files-found: error
