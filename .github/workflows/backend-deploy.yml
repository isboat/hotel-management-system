name: Backend deploy to Azure Web App
on:
  workflow_run:
    workflows: [Backend build]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: backend-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: publish
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'premadesk-api'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_864A225D0FD4408D836FB29830EE1F33 }}
